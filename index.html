
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Ball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">
    <h1>Catch the Ball!</h1>
    <p>Click the ball to catch it.</p>

    <input type="checkbox" id="catch">

    <div class="game-area">
      <label for="catch" class="ball"></label>
      <div class="message">
        🎉 You caught the ball!
        <br>
        <label for="catch" class="restart">Play Again</label>
      </div>
    </div>

    <p class="hint">Made with HTML & CSS only</p>
  </main>

</body>
</html>
